# Compose UPSTREAMU z jedna zmiana: przekazaniem nazwy hosta do budowania
# (patrz WARSTWA WDROZENIOWA 2/2 w Dockerfile). Reszta bez zmian.
#
# Wszystkie wartosci pochodza z .env, ktorego NIE MA w repozytorium.
services:
  finn-mcp:
    build:
      context: .
      args:
        # Domena, pod ktora serwer jest wystawiony przez reverse proxy.
        # Bez niej SDK odrzuca kazde zadanie zza proxy bledem 421.
        FINN_MCP_ALLOWED_HOST: ${FINN_MCP_ALLOWED_HOST:?Ustaw FINN_MCP_ALLOWED_HOST w .env}
    image: finn-mcp:local
    container_name: finn-mcp
    restart: unless-stopped
    environment:
      FINN_MCP_ACCESS_TOKEN: ${FINN_MCP_ACCESS_TOKEN:?Set FINN_MCP_ACCESS_TOKEN in .env}
      FINN_CACHE_DB: /data/cache.sqlite
      FINN_REQUESTS_PER_MINUTE: ${FINN_REQUESTS_PER_MINUTE:-20}
      FINN_CACHE_RAW_HTML: "0"
      # Ta sama wartosc co build arg wyzej. Od wrzesnia 2026 http_server.py
      # czyta ja w czasie dzialania; latka z etapu budowania zostaje jako pas
      # bezpieczenstwa, wiec zadna z dwoch drog nie jest jedyna.
      FINN_MCP_ALLOWED_HOST: ${FINN_MCP_ALLOWED_HOST}
      # OAuth dla custom connectorow; puste wartosci = wylaczone, jak dotad.
      FINN_MCP_PUBLIC_URL: ${FINN_MCP_PUBLIC_URL:-}
      FINN_MCP_LOGIN_SECRET: ${FINN_MCP_LOGIN_SECRET:-}
    ports:
      - "127.0.0.1:${FINN_MCP_PORT:-8000}:8000"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
