[project]
name = "finn-mcp"
version = "0.1.0"
description = "MCP server exposing finn.no (Norwegian classifieds) to Claude"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "aHk-coder", email = "alhjakri@pm.me" },
    { name = "Tomasz Mroczyński" }
]
requires-python = ">=3.11"
keywords = ["mcp", "claude", "finn.no", "classifieds", "norway", "scraper"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "httpx[http2]>=0.28.1",
    # <2: the 2.x SDK moved FastMCP to a separate package, so mcp.server.fastmcp
    # stops importing and the server fails at startup. Lift when the import moves.
    "mcp[cli]>=1.27.0,<2",
    "pydantic>=2.13.1",
    "selectolax>=0.4.7",
]

[project.urls]
Homepage = "https://github.com/tomaszmroczynski/finn-mcp"
Repository = "https://github.com/tomaszmroczynski/finn-mcp"
Issues = "https://github.com/tomaszmroczynski/finn-mcp/issues"
Upstream = "https://github.com/aHk-coder/finn-mcp"

[project.scripts]
finn-mcp = "finn_mcp.server:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
